name: Deploy FastAPI to AWS App Runner

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  build_and_push:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: develop
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create develop env file
        run: |
          cat << 'EOF' > .env.develop
          NODE_ENV=development
          AWS_REGION=${{ secrets.AWS_REGION }}
          USE_SSM_LOCALLY=false
          PORT=8000
          DEBUG=false
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.FASTAPI_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Get ECR Repository from SSM
        id: get-ecr-repo
        run: |
          ECR_REPO=$(aws ssm get-parameter --name "/tuliohealth/dev/infrastructure/fastapi_ecr_repository" --query 'Parameter.Value' --output text)
          echo "ECR_REPOSITORY=$ECR_REPO" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.get-ecr-repo.outputs.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg ENV_FILE=.env.develop -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: build_and_push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.FASTAPI_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get App Runner Service from SSM
        id: get-app-runner-service
        run: |
          SERVICE_NAME=$(aws ssm get-parameter --name "/tuliohealth/dev/infrastructure/fastapi_app_runner_service" --query 'Parameter.Value' --output text)
          echo "APP_RUNNER_SERVICE=$SERVICE_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-apprunner
        run: |
          SERVICE_NAME="${{ steps.get-app-runner-service.outputs.APP_RUNNER_SERVICE }}"
          IMAGE_URI="${{ needs.build_and_push.outputs.image }}"
          
          echo "Deploying image $IMAGE_URI to App Runner service $SERVICE_NAME"
          
          # Update the App Runner service with the new image
          aws apprunner start-deployment --service-arn $(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)
          
          echo "Deployment started for App Runner service: $SERVICE_NAME"

      - name: App Runner ID
        run: echo "App runner ID ${{ steps.deploy-apprunner.outputs.service-id }}"