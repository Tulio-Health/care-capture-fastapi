name: Deploy FastAPI to AWS App Runner - Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create production env file
        run: |
          cat << 'EOF' > .env.production
          NODE_ENV=production
          AWS_REGION=${{ secrets.AWS_REGION }}
          USE_SSM_LOCALLY=false
          PORT=8000
          DEBUG=false
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.FASTAPI_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Get ECR Repository from SSM
        id: get-ecr-repo
        run: |
          ECR_REPO=$(aws ssm get-parameter --name "/tuliohealth/prod/infrastructure/fastapi_ecr_repository" --query 'Parameter.Value' --output text)
          echo "ECR_REPOSITORY=$ECR_REPO" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.get-ecr-repo.outputs.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg ENV_FILE=.env.production -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.FASTAPI_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get App Runner Service from SSM
        id: get-app-runner-service
        run: |
          SERVICE_NAME=$(aws ssm get-parameter --name "/tuliohealth/prod/infrastructure/fastapi_app_runner_service" --query 'Parameter.Value' --output text)
          echo "APP_RUNNER_SERVICE=$SERVICE_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-apprunner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: ${{ steps.get-app-runner-service.outputs.APP_RUNNER_SERVICE }}
          image: ${{ needs.build_and_push.outputs.image }}
          access-role-arn: ${{ secrets.FASTAPI_AWS_ROLE_ARN }}
          region: ${{ secrets.AWS_REGION }}
          cpu: 1
          memory: 2
          port: 8000
          wait-for-service-stability: true

      - name: App Runner ID
        run: echo "App runner ID ${{ steps.deploy-apprunner.outputs.service-id }}"