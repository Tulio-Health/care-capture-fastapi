name: Deploy FastAPI to AWS App Runner - Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create production env file
        run: |
          cat << 'EOF' > .env.production
          AWS_REGION=${{ secrets.AWS_REGION }}
          USE_SSM_LOCALLY=false
          PORT=8000
          DEBUG=false
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.FASTAPI_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Get ECR Repository from SSM
        id: get-ecr-repo
        run: |
          ECR_REPO=$(aws ssm get-parameter --name "/tuliohealth/prod/infrastructure/fastapi_ecr_repository" --query 'Parameter.Value' --output text)
          echo "ECR_REPOSITORY=$ECR_REPO" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.get-ecr-repo.outputs.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg ENV_FILE=.env.production -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.FASTAPI_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-deploy
        uses: aws-actions/amazon-ecr-login@v1

      - name: Get App Runner Service from SSM
        id: get-app-runner-service
        run: |
          SERVICE_NAME=$(aws ssm get-parameter --name "/tuliohealth/prod/infrastructure/fastapi_app_runner_service" --query 'Parameter.Value' --output text)
          echo "APP_RUNNER_SERVICE=$SERVICE_NAME" >> $GITHUB_OUTPUT

      - name: Get ECR Repository from SSM
        id: get-ecr-repo-deploy
        run: |
          ECR_REPO=$(aws ssm get-parameter --name "/tuliohealth/prod/infrastructure/fastapi_ecr_repository" --query 'Parameter.Value' --output text)
          echo "ECR_REPOSITORY=$ECR_REPO" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-apprunner
        run: |
          SERVICE_NAME="${{ steps.get-app-runner-service.outputs.APP_RUNNER_SERVICE }}"
          ECR_REGISTRY="${{ steps.login-ecr-deploy.outputs.registry }}"
          ECR_REPOSITORY="${{ steps.get-ecr-repo-deploy.outputs.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          echo "Deploying image $IMAGE_URI to App Runner service $SERVICE_NAME"
          
          # Get the service ARN
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)
          
          # Update the App Runner service with the new image
          aws apprunner update-service \
            --service-arn $SERVICE_ARN \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'$IMAGE_URI'",
                "ImageConfiguration": {
                  "Port": "8000"
                },
                "ImageRepositoryType": "ECR"
              },
              "AutoDeploymentsEnabled": false
            }'
          
          echo "Service update initiated for $SERVICE_NAME with image $IMAGE_URI"
          
          # Wait for deployment to complete
          echo "Waiting for service to become ready..."
          while true; do
            STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query 'Service.Status' --output text)
            echo "Current status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Service is now running!"
              break
            elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "Service deployment failed with status: $STATUS"
              exit 1
            fi
            echo "Waiting 30 seconds..."
            sleep 30
          done

      - name: App Runner ID
        run: echo "App runner ID ${{ steps.deploy-apprunner.outputs.service-id }}"