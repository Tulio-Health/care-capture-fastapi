name: Tests

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen

      - name: Unit tests (credential-less)
        run: |
          uv run pytest src/app/tests/unit/ \
            --ignore=src/app/tests/unit/test_chat.py \
            --ignore=src/app/tests/unit/test_health.py \
            --ignore=src/app/tests/unit/test_document_type_inference.py \
            -q --no-cov -rA

      - name: QA summary regression safety guards
        run: |
          uv run pytest qa/summary_regression/ -q --no-cov
